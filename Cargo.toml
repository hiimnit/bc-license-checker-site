[package]
name = "bc-license-cmp"
version = "0.1.0"
edition = "2024"

[dependencies]
vercel_runtime = { version = "2.4", features = ["axum"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bc-license-checker = { git = "https://github.com/hiimnit/bc-license-checker.git" }
hyper = "1.11.1"
http-body-util = "0.1.5"
base64 = "0.23.1"


[[bin]]
name = "check"
path = "api/check.rs"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
